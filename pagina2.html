<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Más allá del script — ¿Qué es un NPC?</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <section class="escena2">

    <!-- Fondo (mismo que la portada) -->
    <img src="images/fondo.png" alt="" class="escena2__fondo" aria-hidden="true">

    <!-- Personaje -->
    <img src="images/personaje.png" alt="Personaje IA" class="escena2__personaje">

    <!-- Signo de exclamación (borrar esta línea si ya viene incluido en personaje.png) -->
    <img src="images/exclamacion.png" alt="" class="escena2__exclamacion" aria-hidden="true">

    <!-- Globo de texto -->
    <div class="escena2__globo">
      <img src="images/globo1.png" alt="" class="escena2__globo-imagen" aria-hidden="true">
      <img src="images/triangulo.png" alt="Siguiente" class="escena2__triangulo" id="triangulo">
      <button class="escena2__boton" id="boton-comenzar" type="button">
  <span class="portada__boton-icono" aria-hidden="true">↳</span>
  <span>Comenzar</span>
</button>
      <div class="escena2__globo-texto">
        <p>
          En esta experiencia vamos a aprender sobre
          la <span class="acento">historia y evolución</span> de los <span class="acento">NPC</span>
          a través de los años y cómo se construyen.<br>
          Pero primero: <span class="acento">¿sabés lo que son?</span>
        </p>
      </div>
    </div>
     <img src="images/personaje.png" alt="Personaje IA" class="escena2__personaje">

  </section>

</body>
</html>
