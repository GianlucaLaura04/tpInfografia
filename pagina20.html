<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Más allá del script — Conversaciones Reales (proceso)</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <section class="escena20">

    <!-- Fondo: la chica -->
    <img src="images/fondo19.png" alt="" class="escena20__fondo" aria-hidden="true">

    <!-- Botón Volver -->
    <a href="pagina21.html" class="escena20__boton-volver">
      <span class="portada__boton-icono" aria-hidden="true">↳</span>
      <span>Volver</span>
    </a>

    <h2 class="escena20__titulo">Conversaciones Reales</h2>

    <p class="escena20__entrada">
      <span class="acento-azul">ENTRADA</span>: la IA escucha y
      <span class="acento">reconoce</span> la voz<br>
      (Whisper o Nvidia Riva)
    </p>

    <p class="escena20__procesando">PROCESANDO..</p>

    <!-- Puntos 1, 2, 3 con hover -->
    <button class="escena20__punto escena20__punto--1" type="button" aria-label="Paso 1">
      <div class="escena20__extra">
        <img src="images/globo14.png" alt="" class="escena20__extra-imagen" aria-hidden="true">
        <p class="escena20__extra-texto">Analiza el contexto<br>(objeto, entorno, relación)</p>
      </div>
    </button>

    <button class="escena20__punto escena20__punto--2" type="button" aria-label="Paso 2">
      <div class="escena20__extra">
        <img src="images/globo14.png" alt="" class="escena20__extra-imagen" aria-hidden="true">
        <p class="escena20__extra-texto">Consulta memoria<br>(historial, personalidad)</p>
      </div>
    </button>

    <button class="escena20__punto escena20__punto--3" type="button" aria-label="Paso 3">
      <div class="escena20__extra">
        <img src="images/globo14.png" alt="" class="escena20__extra-imagen" aria-hidden="true">
        <p class="escena20__extra-texto">Evalúa opciones<br>(devolver, quedarse, preguntar)</p>
      </div>
    </button>

    <p class="escena20__generacion">
      <span class="acento-azul">GENERACIÓN</span>: genera <span class="acento">respuesta</span> de voz y
      <span class="acento">movimientos</span> del rostro<br>(TTS + Nvidia Audio2Face).
    </p>

    <p class="escena20__integracion">
      <span class="acento-azul">INTEGRACIÓN</span>: se vincula la acción con el entorno físico<br>(NVIDIA ACE).
    </p>

  </section>

</body>
</html>
