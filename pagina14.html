    <h2 class="escena14b__titulo">Lógica Difusa</h2>

    <p class="escena14b__bajada">
      Los NPCs dejan de responder en 0 o 100% sino que ahora toman
      <span class="acento">decisiones intermedias</span> evaluando el
      <span class="acento">nivel de estrés</span> del entorno.
    </p>
<!-- Zona 1: pico alto de estrés -->
<button class="escena14b__punto escena14b__punto--alto" type="button" aria-label="Estrés muy alto">
  <div class="escena14b__extra">
    <img src="images/globo11.png" alt="" class="escena14b__extra-imagen" aria-hidden="true">
    <p class="escena14b__extra-texto">Si el estrés es "muy alto", la IA detiene la música de tensión, deja de generar infectados y genera botiquines para dar un respiro.</p>
  </div>
</button>

<!-- Zona 2: valle bajo de estrés -->
<button class="escena14b__punto escena14b__punto--bajo" type="button" aria-label="Estrés bajo">
  <div class="escena14b__extra">
    <img src="images/globo12.png" alt="" class="escena14b__extra-imagen" aria-hidden="true">
    <p class="escena14b__extra-texto">Si el estrés es bajo, lanza hordas y enemigos especiales para aumentar la tensión.</p>
  </div>
</button>
