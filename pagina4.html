<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Más allá del script — Simulación Sensorial</title>
  <link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body>

  <section class="escena4">

    <!-- Fondo: cabeza del NPC y resto del layout -->
    <img src="images/fondo3.png" alt="" class="escena4__fondo" aria-hidden="true">

    <!-- Título -->
    <h2 class="escena4__titulo">Simulación Sensorial</h2>

<!-- Texto chico (globo 2) -->
<div class="escena4__globo2">
  <img src="images/globo2.png" alt="" class="escena4__globo2-imagen" aria-hidden="true">
  <div class="escena4__globo2-texto">
    <p>Activa el comportamiento para<br>hacer funcionar el módulo</p>
  </div>
</div>

    <!-- Interruptores -->
    <button class="escena4__interruptor escena4__interruptor--vista" type="button" aria-label="Activar vista">
      <span class="escena4__interruptor-circulo"></span>
    </button>

    <button class="escena4__interruptor escena4__interruptor--oido" type="button" aria-label="Activar oído">
      <span class="escena4__interruptor-circulo"></span>
    </button>

    <button class="escena4__interruptor escena4__interruptor--cerebro" type="button" aria-label="Activar procesamiento">
      <span class="escena4__interruptor-circulo"></span>
    </button>

  </section>

  <script src="pagina4.js" defer></script>

</body>
</html>
