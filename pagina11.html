<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Más allá del script — Navegación Orgánica (detalle)</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <section class="escena11">

    <!-- Fondo: la chica + el mapa isométrico -->
    <img src="images/fondo10.png" alt="" class="escena11__fondo" aria-hidden="true">

    <h2 class="escena11__titulo">Navegación Orgánica</h2>

    <p class="escena11__bajada">
      Con la llegada de los sistemas tácticos y de planificación se volvió
      fundamental que el enemigo <span class="acento">busque cobertura</span>,
      <span class="acento">rodee al jugador</span> y trace
      <span class="acento">rutas dinámicas</span> esquivando obstáculos en el
      <span class="acento">entorno</span>.
    </p>

    <!-- Cobertura -->
    <button class="escena11__etiqueta escena11__etiqueta--cobertura" type="button">
      <img src="images/globo9.png" alt="" class="escena11__etiqueta-imagen" aria-hidden="true">
      <span class="escena11__etiqueta-texto">Cobertura</span>

      <div class="escena11__extra">
        <img src="images/globo10.png" alt="" class="escena11__extra-imagen" aria-hidden="true">
        <p class="escena11__extra-texto">Si detectan una amenaza pueden decidir ponerse a cobertura y buscar el camino más seguro hacia el objetivo.</p>
      </div>
    </button>

    <!-- Suelo -->
    <button class="escena11__etiqueta escena11__etiqueta--suelo" type="button">
      <img src="images/globo9.png" alt="" class="escena11__etiqueta-imagen" aria-hidden="true">
      <span class="escena11__etiqueta-texto">Suelo</span>

      <div class="escena11__extra">
        <img src="images/globo10.png" alt="" class="escena11__extra-imagen" aria-hidden="true">
        <p class="escena11__extra-texto">Se divide en una red de polígonos que indica donde se puede caminar. Esto permite que el trayecto se vea menos robótico.</p>
      </div>
    </button>

    <!-- Entorno -->
    <button class="escena11__etiqueta escena11__etiqueta--entorno" type="button">
      <img src="images/globo9.png" alt="" class="escena11__etiqueta-imagen" aria-hidden="true">
      <span class="escena11__etiqueta-texto">Entorno</span>

      <div class="escena11__extra">
        <img src="images/globo10.png" alt="" class="escena11__extra-imagen" aria-hidden="true">
        <p class="escena11__extra-texto">Los NPCs interactúan con el entorno orgánicamente. Ej: si empieza a llover, buscan un techo.</p>
      </div>
    </button>
<a href="pagina12.html" class="escena11__boton-volver">
  <span class="portada__boton-icono" aria-hidden="true">↳</span>
  <span>Volver</span>
</a>
  </section>

</body>
</html>
