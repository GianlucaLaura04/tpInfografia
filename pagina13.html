<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Más allá del script — Lógica Difusa</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <section class="escena13">

    <!-- Fondo -->
    <img src="images/fondo.png" alt="" class="escena13__fondo" aria-hidden="true">

    <h2 class="escena13__titulo">Lógica Difusa</h2>

    <!-- Globo de texto -->
    <div class="escena13__globo2">
      <img src="images/globo2.png" alt="" class="escena13__globo2-imagen" aria-hidden="true">
      <p class="escena13__globo2-texto">Desliza para cambiar el nivel<br>de su tensión</p>
      <img src="images/personaje.png" alt="Personaje IA" class="escena13__globo2-personaje">
    </div>

    <!-- Imagen del personaje femenino, cambia según el slider -->
    <img src="images/femenino1.png" alt="Estado emocional del personaje" class="escena13__femenino" id="img-femenino">

    <!-- Slider -->
    <input type="range" min="0" max="100" value="0" step="1" class="escena13__slider" id="slider-tension" aria-label="Nivel de tensión">

  </section>

</body>
</html>
