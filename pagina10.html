<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Más allá del script — Navegación Orgánica</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <section class="escena10">

    <!-- Fondo: la chica -->
    <img src="images/fondo9.png" alt="" class="escena10__fondo" aria-hidden="true">

    <h2 class="escena10__titulo">Navegación Orgánica</h2>

    <!-- Globo de texto -->
    <div class="escena10__globo2">
      <img src="images/globo2.png" alt="" class="escena10__globo2-imagen" aria-hidden="true">
      <p class="escena10__globo2-texto">Activá sus sensores de<br>adaptación de ruta</p>
      <img src="images/personaje.png" alt="Personaje IA" class="escena10__globo2-personaje">
    </div>

    <!-- Selector Lineal / Orgánica -->
    <div class="escena10__selector">

      <img src="images/linealactivo.png" alt="Lineal" class="escena10__opcion escena10__opcion--lineal" id="img-lineal">

      <button class="escena10__interruptor" id="interruptor-navegacion" type="button" aria-label="Cambiar tipo de navegación">
        <span class="escena10__interruptor-circulo"></span>
      </button>

      <img src="images/organicainactivo.png" alt="Orgánica" class="escena10__opcion escena10__opcion--organica" id="img-organica">

    </div>

  </section>

</body>
</html>
